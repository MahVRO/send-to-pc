<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send to PC</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #161616;
      --accent: #6b4eff;
      --text: #ffffff;
      --muted: #9a9a9a;
      --danger: #ff4e4e;
      --success: #4eff8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .app {
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { font-size: 20px; margin: 0; text-align: center; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row { display: flex; gap: 10px; }
    .editor {
      min-height: 120px;
      background: #0b0b0b;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: var(--text);
      padding: 10px;
      font-size: 14px;
    }
    .editor:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    button {
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2a2a2a; color: var(--text); }
/* make non-button secondary pills visible */
.secondary.upload-pill {
  background: #2a2a2a;
  color: var(--text);
}
.upload-pill{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 14px;
  border-radius:999px;
  cursor:pointer;
}
.upload-sep{
  width:1px;
  height:16px;
  background:#3a3a3a;
}
.upload-caret{font-size:12px;opacity:.8}
.upload-menu{
  position:absolute;
  top:110%;
  left:0;
  background:#1e1e1e;
  border:1px solid #2a2a2a;
  border-radius:10px;
  padding:6px;
  display:none;
  flex-direction:column;
  min-width:120px;
  z-index:10;
}
.upload-menu div{
  padding:8px 10px;
  border-radius:8px;
  font-size:13px;
}
.upload-menu div:hover{background:#2a2a2a;}
    button.disabled { opacity: 0.4; pointer-events: none; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
    .toolbar button {
      padding: 6px 10px;
      border-radius: 8px;
      background: #2a2a2a;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .mode-toggle { display: flex; gap: 6px; margin-bottom: 6px; }
    .mode-toggle button { flex: 1; background: #2a2a2a; color: var(--text); }
    .mode-toggle button.active { background: var(--accent); }
    .pill {
      background: #1e1e1e;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .pill.hover { background: #2a2a2a; opacity: 0.6; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item { background: #0b0b0b; border-radius: 10px; padding: 10px; font-size: 14px; }
    .item-header { display: flex; align-items: center; }
    .item span { color: var(--muted); font-size: 12px; }
    .delete-x {
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 8px;
      margin-left: auto;
    }
    .item-preview {
      margin-top: 8px;
      background: #121212;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      color: #ddd;
      cursor: text;
      display: none;
      white-space: pre-wrap;
      transition: opacity 0.2s ease;
    }
    .status {
      font-size: 13px;
      text-align: center;
    }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    @media (min-width: 768px) { .app { max-width: 480px; margin: auto; } }
  </style>
</head>
<body>
  <div class="app">
    <h1>Send to PC</h1>
    <div class="card">
      <div class="mode-toggle">
        <button id="textMode" class="active">Text</button>
        <button id="codeMode">Code</button>
      </div>
      <div class="toolbar">
        <button data-tag="strong">B</button>
        <button data-tag="em">I</button>
        <button data-tag="u">U</button>
        <button data-tag="s">S</button>
      </div>
      <div id="textEditor" class="editor" contenteditable></div>
      <pre id="codeEditor" class="editor" contenteditable style="display:none;font-family:monospace;"></pre>
      <div class="row" style="align-items:center;">
  <div id="uploadDropdown" class="secondary upload-pill">
    <span id="uploadMain">Upload</span>
    <span class="upload-sep"></span>
    <span id="uploadCaret" class="upload-caret">▾</span>
    <div id="uploadMenu" class="upload-menu">
      <div data-type="file">📄 File</div>
      <div data-type="image">🖼️ Image</div>
    </div>
  </div>
  <div id="sizeInfo" style="margin-left:auto;font-size:12px;color:var(--muted);">0 / 100 MB</div>
</div>
<div id="pendingPills" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
      <input id="fileInput" type="file" multiple style="display:none;" />
      <input id="imageInput" type="file" accept="image/*" multiple style="display:none;" />
      <button id="nextBtn" style="width:100%">Next</button>
    </div>
    <div class="card">
      <div class="row" style="align-items:center;">
  <h2 style="font-size:16px;margin:0">Ready to send</h2>
  <div id="readySizeInfo" style="margin-left:auto;font-size:12px;color:var(--muted);">0 / 100 MB</div>
</div>
      <div id="sentList" class="list"></div>
      <div id="status" class="status"></div>
      <button id="sendBtn" class="disabled">Send</button>
<div id="finalSizeInfo" style="font-size:12px;text-align:center;color:var(--muted);margin-top:6px;">Server usage: loading…</div>
    </div>
  </div>
  <script>
    console.log('[INIT] Web sender loaded');

    const textEditor = document.getElementById('textEditor');
    const codeEditor = document.getElementById('codeEditor');
    const sentList = document.getElementById('sentList');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');
    const textModeBtn = document.getElementById('textMode');
    const codeModeBtn = document.getElementById('codeMode');
    
    const pendingPills = document.getElementById('pendingPills');
    const sizeInfo = document.getElementById('sizeInfo');
    const MAX_BYTES = 100 * 1024 * 1024;
    let pendingUploads = [];
    let isSending = false;
    const API_URL = 'https://send-to-pc.onrender.com';
    const SERVER_LIMIT_MB = 100;
    const APP_TOKEN = '9f8a1d3c4e6b7a2f8c9d0e1a2b3c4d5e153uoi135e7f8a9b0c1d2e3f4g5h6i7j';

    textModeBtn.onclick = () => {
      console.log('[MODE] Switched to text');
      textModeBtn.classList.add('active');
      codeModeBtn.classList.remove('active');
      textEditor.style.display = 'block';
      codeEditor.style.display = 'none';
    };

    codeModeBtn.onclick = () => {
      console.log('[MODE] Switched to code');
      codeModeBtn.classList.add('active');
      textModeBtn.classList.remove('active');
      textEditor.style.display = 'none';
      codeEditor.style.display = 'block';
    };

    document.querySelectorAll('.toolbar button').forEach(btn => {
      btn.onclick = () => {
        console.log('[FORMAT]', btn.dataset.tag);
        if (codeEditor.style.display === 'block') return;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        if (!textEditor.contains(range.commonAncestorContainer)) return;
        const el = document.createElement(btn.dataset.tag);
        el.appendChild(range.extractContents());
        range.insertNode(el);
        sel.removeAllRanges();
        sel.addRange(range);
      };
    });

    function refreshSendButton() {
  console.log('[UI] Refresh send button', sentList.children.length, isSending);

  let total = 0;
  sentList.querySelectorAll('.item').forEach(item => {
    const upload = item.__upload;
    if (upload) total += upload.file.size;
  });

  sendBtn.classList.toggle('disabled', !total || isSending);
}

async function refreshServerUsage() {
  try {
    const res = await fetch(`${API_URL}/pending`, {
      headers: { Authorization: `Bearer ${APP_TOKEN}` }
    });
    if (!res.ok) throw new Error('pending failed');
    const data = await res.json();

    let total = 0;
    (data.batches || []).forEach(batch => {
      (batch.files || []).forEach(f => total += f.size || 0);
    });

    const mb = Math.round(total / 1024 / 1024);
    finalSizeInfo.textContent = `Server usage: ${mb} / ${SERVER_LIMIT_MB} MB`;
    finalSizeInfo.style.color = total > MAX_BYTES ? 'var(--danger)' : 'var(--muted)';
  } catch (e) {
    console.error('[SERVER] usage fetch failed', e);
    finalSizeInfo.textContent = 'Server usage: unavailable';
    finalSizeInfo.style.color = 'var(--muted)';
  }
}

    function addItem(title, content, upload = null) {
      console.log('[ITEM] Add', title, upload);
      const div = document.createElement('div');
      div.className = 'item';
      if (upload) div.__upload = upload;
      div.innerHTML = `
        <div class="item-header">
          <div class="item-title">${title}<br><span>pending</span></div>
          <button class="delete-x">×</button>
        </div>
        <div class="item-preview">${content}</div>
      `;

      const preview = div.querySelector('.item-preview');
      const del = div.querySelector('.delete-x');
      const header = div.querySelector('.item-header');

      header.onclick = () => {
        const open = preview.style.display === 'block';
        console.log('[ITEM] Toggle preview', title, !open);
        preview.style.display = open ? 'none' : 'block';
        preview.style.opacity = open ? '0' : '1';
      };

      del.onclick = e => {
        console.log('[ITEM] Delete', title);
        e.stopPropagation();
        div.remove();
        refreshSendButton();
      };

      sentList.appendChild(div);
      refreshSendButton();
    }

    function renderPending() {
      console.log('[UPLOADS] Render pending', pendingUploads.length);
      pendingPills.innerHTML = '';
      let total = 0;

      pendingUploads.forEach(entry => {
        total += entry.file.size;
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.textContent = `${entry.type === 'image' ? '🖼️' : '📄'} ${entry.file.name}`;

        let clicks = 0;
        pill.onmouseenter = () => pill.classList.add('hover');
        pill.onmouseleave = () => pill.classList.remove('hover');
        pill.onclick = () => {
          clicks++;
          if (clicks === 2) {
            console.log('[UPLOADS] Remove pending', entry.file.name);
            pendingUploads = pendingUploads.filter(x => x !== entry);
            renderPending();
          }
          setTimeout(() => clicks = 0, 300);
        };

        pendingPills.appendChild(pill);
      });

      sizeInfo.textContent = `${Math.round(total / 1024 / 1024)} / 100 MB`;
      sizeInfo.style.color = total > MAX_BYTES ? 'var(--danger)' : 'var(--muted)';
    }

    document.getElementById('fileInput').onchange = e => {
      console.log('[UPLOAD] Files selected', e.target.files.length);
      pendingUploads.push(...Array.from(e.target.files).map(f => ({ type: 'file', file: f })));
      e.target.value = '';
      renderPending();
    };

    document.getElementById('imageInput').onchange = e => {
      console.log('[UPLOAD] Images selected', e.target.files.length);
      pendingUploads.push(...Array.from(e.target.files).map(f => ({ type: 'image', file: f })));
      e.target.value = '';
      renderPending();
    };

    const uploadDropdown = document.getElementById('uploadDropdown');
const uploadMenu = document.getElementById('uploadMenu');
const uploadMain = document.getElementById('uploadMain');
const uploadCaret = document.getElementById('uploadCaret');

uploadMain.onclick = e => {
  e.stopPropagation();
  document.getElementById('fileInput').click();
};

uploadCaret.onclick = e => {
  e.stopPropagation();
  uploadMenu.style.display = uploadMenu.style.display === 'flex' ? 'none' : 'flex';
};

uploadMenu.querySelectorAll('div').forEach(opt=>{
  opt.onclick = e =>{
    e.stopPropagation();
    uploadMenu.style.display='none';


// close upload dropdown when clicking anywhere else
 document.addEventListener('click', e => {
  if (!uploadDropdown.contains(e.target)) {
    uploadMenu.style.display = 'none';
  }
});
    uploadMenu.style.display='none';
    if(opt.dataset.type==='file') document.getElementById('fileInput').click();
    if(opt.dataset.type==='image') document.getElementById('imageInput').click();
  };
});

    document.getElementById('nextBtn').onclick = () => {
      console.log('[FLOW] Next clicked');
      if (codeEditor.style.display === 'block') {
        const c = codeEditor.innerText.trim();
        if (c) {
          addItem('Code block', `<pre>${c}</pre>`);
          codeEditor.innerText = '';
        }
      } else {
        const t = textEditor.innerHTML.trim();
        if (t) {
          addItem('Text message', t);
          textEditor.innerHTML = '';
        }
      }

      pendingUploads.forEach(entry => {
        addItem(
          entry.file.name,
          `${entry.type === 'image' ? 'Image' : 'File'} (${Math.round(entry.file.size / 1024)} KB)`,
          entry
        );
      });
      pendingUploads = [];
      renderPending();
    };

    // initial server usage fetch
refreshServerUsage();

sendBtn.onclick = async () => {
      console.log('[SEND] Clicked');
      if (sendBtn.classList.contains('disabled') || isSending) return;
      isSending = true;
      statusEl.textContent = 'Sending…';
      statusEl.className = 'status';
      refreshSendButton();

      const form = new FormData();
      const items = [];

      sentList.querySelectorAll('.item').forEach(item => {
        const title = item.querySelector('.item-title').childNodes[0].textContent.trim();
        const previewEl = item.querySelector('.item-preview');
        const preview = previewEl ? previewEl.innerHTML : '';

        console.log('[SEND] Collect item', title);

        if (title === 'Text message') {
          items.push({ type: 'text', name: null, size: preview.length, content: preview, file_path: null });
        } else if (title === 'Code block') {
          items.push({ type: 'code', name: null, size: preview.length, content: preview, file_path: null });
        } else {
          const upload = item.__upload;
          if (upload) {
            form.append('files', upload.file);
            items.push({ type: upload.type, name: upload.file.name, size: upload.file.size, content: null, file_path: null });
          }
        }
      });

      console.log('[SEND] Items payload', items);

      form.append('meta', JSON.stringify({ items }));

      try {
        const res = await fetch(`${API_URL}/send`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${APP_TOKEN}` },
          body: form
        });

        console.log('[SEND] Response status', res.status);

        if (!res.ok) throw new Error('Upload failed');

        statusEl.textContent = 'Sent successfully';
        statusEl.className = 'status success';
        sentList.innerHTML = '';
        refreshServerUsage();
      } catch (err) {
        console.error('[SEND] Error', err);
        statusEl.textContent = 'Send failed. Tap Send to retry.';
        statusEl.className = 'status error';
      } finally {
        isSending = false;
        refreshSendButton();
      }
    };
  </script>
</body>
</html>
